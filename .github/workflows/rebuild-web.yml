# Vuelve a compilar la web para que /precios/ recoja los precios de la semana
# (se escriben en el HTML al compilar). Corre el martes, tras los syncs del lunes.
# Necesita el secreto AMPLIFY_WEBHOOK_URL: Amplify → Hosting → Build settings →
# Incoming webhooks → crear uno para la rama main y pegar su URL en GitHub.
name: Actualizar precios de la web

on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Lanzar compilación en Amplify
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$AMPLIFY_WEBHOOK_URL" ]; then
            echo "::error::Falta el secreto AMPLIFY_WEBHOOK_URL"
            exit 1
          fi
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d '{}' "$AMPLIFY_WEBHOOK_URL"
